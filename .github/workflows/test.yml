name: Test Web System

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Validate backend JavaScript
        working-directory: backend
        shell: bash
        run: |
          find . -path './node_modules' -prune -o -type f -name '*.js' -print0 | xargs -0 -n1 node --check

      # The backend test script is currently a placeholder that exits with code 1.
      # Add automated backend tests before changing this validation step to npm test.

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run frontend tests
        working-directory: frontend
        run: npm test -- --watchAll=false --passWithNoTests

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Validate ML service Python
        run: python -m compileall -q ml-service/app

      - name: Install Playwright test dependencies
        working-directory: testing/tests
        run: npm ci

      - name: Install Playwright browsers
        working-directory: testing/tests
        run: npx playwright install --with-deps

      - name: Start backend
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
        run: |
          if [ -z "$MONGODB_URI" ]; then
            echo "MONGODB_URI GitHub Actions secret is required for integration tests."
            exit 1
          fi
          nohup npm --prefix backend start > backend.log 2>&1 &
          echo $! > backend.pid

      - name: Start frontend
        run: |
          nohup env BROWSER=none npm --prefix frontend start > frontend.log 2>&1 &
          echo $! > frontend.pid

      - name: Wait for web services
        shell: bash
        run: |
          for attempt in {1..60}; do
            backend_ready=false
            frontend_ready=false

            curl --fail --silent http://localhost:5005/api/health > /dev/null && backend_ready=true || true
            curl --fail --silent http://localhost:3000/ > /dev/null && frontend_ready=true || true

            if [ "$backend_ready" = true ] && [ "$frontend_ready" = true ]; then
              exit 0
            fi
            sleep 2
          done

          echo 'Backend log:'
          cat backend.log || true
          echo 'Frontend log:'
          cat frontend.log || true
          exit 1

      - name: Run full Playwright UI suite
        working-directory: testing/tests
        run: npx playwright test

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: testing/tests/playwright-report/
          retention-days: 30

      - name: Upload service logs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: service-logs
          path: |
            backend.log
            frontend.log
          retention-days: 7